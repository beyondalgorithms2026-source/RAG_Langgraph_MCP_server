[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-enterprise-mcp"
version = "0.1.0"
description = "Thin MCP wrapper for the local RAG enterprise backend."
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=9.0,<10"]

[project.scripts]
rag-enterprise-mcp = "rag_enterprise_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",   # line length — formatter handles what it can; remaining are strings/URLs
  "RUF001", # ambiguous unicode — intentional curly quotes in user-facing strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

