[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-enterprise-mcp"
version = "0.1.0"
description = "Thin MCP wrapper for the local RAG enterprise backend."
requires-python = ">=3.9"

[project.scripts]
rag-enterprise-mcp = "rag_enterprise_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

